<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Euspell PDF</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header id="bar">
      <span id="filename">Euspell PDF</span>
      <span id="pagecount" hidden></span>
      <span class="actions">
        <button type="button" id="print" hidden>Print</button>
        <button type="button" id="download" hidden>Download</button>
        <a id="original" href="#" rel="noreferrer">Open original</a>
      </span>
    </header>
    <main id="pages">
      <p id="status">Loading…</p>
    </main>
    <script type="module" src="../../dist/pdf-viewer.js"></script>
  </body>
</html>
