<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/48.png" alt="" width="22" height="22" />
      <h1>Euspell</h1>
    </header>

    <div class="notice" id="reloadRow" hidden>
      <span>This PDF opened in the browser’s own viewer.</span>
      <button type="button" id="reload" class="link">Reload</button>
    </div>

    <label class="row">
      <span>Convert pages</span>
      <input type="checkbox" id="enabled" />
    </label>

    <div class="row" id="dictateRow" hidden>
      <span>Dictate euspell</span>
      <button type="button" id="dictate" class="link">Start</button>
    </div>

    <p class="hint" id="hint"></p>

    <footer>
      <button type="button" id="options" class="link">Options</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
