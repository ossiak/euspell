<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/48.png" alt="" width="22" height="22" />
      <h1>Euspell</h1>
    </header>

    <!-- Shown when the extension's host access has been revoked (Firefox lets
         users toggle "Access your data for all websites" off per add-on), in
         which case nothing converts and the controls below would look dead. -->
    <div class="notice" id="permRow" hidden>
      <span>Euspell can’t read pages — site access is turned off.</span>
      <button type="button" id="grant" class="link">Grant access</button>
    </div>

    <label class="row">
      <span>Convert pages</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row" id="siteRow" hidden>
      <span>On <strong id="host"></strong></span>
      <input type="checkbox" id="site" />
    </label>

    <label class="row" id="viewRow" hidden>
      <span>Show original English</span>
      <input type="checkbox" id="showOriginal" />
    </label>

    <div class="row" id="dictateRow" hidden>
      <span>Dictate euspell</span>
      <button type="button" id="dictate" class="link">Start</button>
    </div>

    <p class="hint" id="hint"></p>

    <footer>
      <button type="button" id="options" class="link">Options</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
