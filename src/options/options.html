<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="../../icons/48.png" alt="" width="28" height="28" />
        <h1>Euspell options</h1>
      </header>

      <section>
        <label class="row">
          <span>
            Convert pages
            <small>Turn the whole extension on or off. The toolbar icon shows
              which it is: the normal mark while converting, inverted while off.</small>
          </span>
          <input type="checkbox" id="enabled" />
        </label>
      </section>

      <section>
        <div class="row">
          <span>
            Site access
            <small id="accessHint"></small>
          </span>
          <button type="button" id="grant" hidden>Grant access</button>
        </div>
      </section>

      <p class="muted note">
        Euspell converts text entirely on your device — the text you read is
        never sent anywhere. Dictation is the exception: it uses your browser’s
        own speech recognition, which transcribes in the cloud.
      </p>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
