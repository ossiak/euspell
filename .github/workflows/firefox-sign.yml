# Builds, stages, and submits the Firefox package to addons.mozilla.org (AMO)
# via `web-ext sign`. Runs when a GitHub release is published, or on demand.
#
# One-time setup:
#   1. Create the add-on's AMO API credentials at
#      https://addons.mozilla.org/developers/addon/api/key/ and add them as repo
#      secrets (Settings ▸ Secrets and variables ▸ Actions):
#        AMO_JWT_ISSUER  — the "JWT issuer"
#        AMO_JWT_SECRET  — the "JWT secret"
#   2. Nothing to set: the gecko id in build/gen-firefox.js is euspell@euspell.org
#      and is permanent — AMO binds it on the first submission. If an AMO listing
#      is created, its ID must be this one.
#   3. Bump "version" in manifest.json before each run — AMO rejects a version
#      that already exists.
#
# Channels:
#   unlisted — self-distribution, and the DEFAULT here. AMO signs immediately and
#              web-ext downloads the signed .xpi (uploaded as a build artifact
#              below) for you to host. No review queue, and no
#              data_collection_permissions requirement, so strict_min_version can
#              stay at 128 and ESR keeps working.
#   listed   — submits a new version to the public AMO listing (goes to review;
#              AMO signs it after approval). Requires the listing metadata, a
#              source-code submission (the package contains rollup output), and
#              data_collection_permissions — which only exists in Firefox 140+,
#              so it forces strict_min_version up and drops ESR 128.
#
# Listing is deliberate, never automatic. Publishing a GitHub release signs
# UNLISTED; a listed submission has to be started by hand from the Actions tab
# with channel=listed. This matters because AMO never accepts a version string
# twice: an accidental listed submission does not merely go to the wrong place,
# it spends that version permanently.
name: Sign Firefox add-on

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: AMO channel (listed goes to public review and cannot be undone)
        type: choice
        options: [unlisted, listed]
        default: unlisted

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AMO rejects a version it has already accepted, and there is no way to
      # replace one — so submitting the wrong number costs a version rather than
      # a re-run. On a release trigger the tag states the intended version; check
      # manifest.json agrees before spending the build on it. (npm test separately
      # holds manifest.json and package.json to each other.)
      - name: Check the release tag matches manifest.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          man="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$man" ]; then
            echo "::error::release tag $GITHUB_REF_NAME != manifest.json $man — bump manifest.json to match the tag"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node build/gen-firefox.js
      # Without this the run gets as far as building, then fails inside web-ext
      # with an authentication error that reads like an AMO outage rather than a
      # missing secret. Checked after the build is cheap; checked before it is
      # clearer, so it goes first.
      - name: Check AMO credentials are present
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET are not set on this repository. Create an API key at https://addons.mozilla.org/developers/addon/api/key/ and add both under Settings > Secrets and variables > Actions. See docs/signing.md."
            exit 1
          fi

      - name: Sign & submit to AMO
        run: >
          npx web-ext sign
          --source-dir build/firefox
          --channel ${{ inputs.channel || 'unlisted' }}
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"
          --artifacts-dir web-ext-artifacts
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      # unlisted signing yields a downloadable .xpi; listed submissions don't, so
      # tolerate its absence.
      - name: Upload signed .xpi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: web-ext-artifacts/*.xpi
          if-no-files-found: ignore
