# Runs the test suite and validates the Firefox package on every push/PR.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 (LTS), not 20: the test script's `node --test "tests/**/*.test.js"`
          # relies on glob expansion for --test, which landed in Node 21.
          node-version: 22
          cache: npm
      - run: npm ci
      # dist/ is gitignored, so build first: several tests import dist/lexicon.js,
      # and the Firefox package is staged from the build output.
      - run: npm run build
      - run: npm test
      - run: node build/gen-firefox.js
      # web-ext lint exits 0 on warnings-only (the two vendored PDF.js warnings);
      # it fails the job only on genuine errors.
      - run: npm run lint:firefox
